<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Aşık Berkan</title>

<style>
body{
  margin:0;
  font-family:'Georgia', serif;
  background:radial-gradient(circle at top, #ffb6c1, #ff4d6d);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{
  color:white;
  margin-bottom:15px;
  letter-spacing:1px;
}

.envelope{
  width:320px;
  height:220px;
  background:#e63946;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
  position:relative;
  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.03)}
  100%{transform:scale(1)}
}

.letter{
  width:280px;
  height:170px;
  background:#fff;
  position:absolute;
  left:20px;
  bottom:-180px;
  transition:1s ease;
  border-radius:12px;
  padding:20px;
  box-sizing:border-box;
  text-align:center;
}

.letter.open{
  bottom:20px;
}

#text{
  font-size:18px;
  color:#444;
  min-height:60px;
}

.buttons{
  margin-top:20px;
}

button{
  background:white;
  border:none;
  padding:10px 22px;
  margin:5px;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
}

.heart{
  position:absolute;
  font-size:18px;
  animation:floatUp linear infinite;
  opacity:.7;
}

@keyframes floatUp{
  from{transform:translateY(100vh);opacity:1}
  to{transform:translateY(-10vh);opacity:0}
}
</style>
</head>

<body>

<h1>💌 Aşık Berkan</h1>

<div class="envelope">
  <div class="letter" id="letter">
    <div id="text"></div>
  </div>
</div>

<div class="buttons">
  <button onclick="openLetter()">Mektubu Aç</button>
  <button onclick="closeLetter()">Kapat</button>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_4a70e3c1a3.mp3">
</audio>

<script>
const message="Yılbaşının getirdiği en güzel hediye o güzel gözleri ❤️";
let i=0;

function typeText(){
  if(i<message.length){
    document.getElementById("text").innerHTML+=message.charAt(i);
    i++;
    setTimeout(typeText,65);
  }
}

function openLetter(){
  document.getElementById("letter").classList.add("open");
  document.getElementById("music").volume=0;
  document.getElementById("music").play();
  let v=0;
  let fade=setInterval(()=>{
    if(v<0.6){v+=0.05;music.volume=v}else clearInterval(fade)
  },120);
  document.getElementById("text").innerHTML="";
  i=0;
  typeText();
}

function closeLetter(){
  document.getElementById("letter").classList.remove("open");
  document.getElementById("music").pause();
}

// Kalp yağmuru
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(Math.random()*3+4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},500);
</script>

</body>
</html>
